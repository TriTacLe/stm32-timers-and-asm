name: Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# the jobs only build, nothing writes back to the repo
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # apt took eighteen minutes on one run while the compiles took twenty
      # one seconds, so the toolchain comes from the cached action instead
      - name: Install the ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
        with:
          release: "10.3-2021.10"

      - name: Build every optimisation level
        working-directory: Practical_1B/board
        run: |
          echo '### Code size by optimisation level' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for opt in -O0 -O1 -O2 -Os; do
            make -j"$(nproc)" OPT=$opt BUILD_DIR=build$opt >/dev/null
            printf '%-4s %s\n' "$opt" \
              "$(arm-none-eabi-size build$opt/Practical_1B.elf | tail -1)" \
              >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build each task target
        working-directory: Practical_1B/board
        run: |
          for task in 2 4 5; do
            make -j"$(nproc)" TASK=$task BUILD_DIR=build-task$task >/dev/null
          done

      - name: Run the Task 1 golden measure
        working-directory: Practical_1B/Task1_PC
        run: |
          make >/dev/null
          {
            echo '### Task 1 golden measure'
            echo '```'
            ./golden
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            Practical_1B/board/build-task*/Practical_1B.elf
            Practical_1B/board/build-task*/Practical_1B.bin
